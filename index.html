<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トレーニング管理 | おしえてかめさん</title>
    
    <link rel="apple-touch-icon" href="IMG_4231.png">
    <link rel="icon" type="image/png" href="IMG_4231.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="トレ管理">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐢 トレーニング・ログ</h1>
            <p>種別を選んでカレンダーに記録</p>
        </header>

        <main>
            <div class="menu-grid">
                <button type="button" class="menu-btn workout" onclick="selectMenu('筋トレ', '#e74c3c', '🔴')">
                    <span class="icon">🏋️</span>
                    <span class="label">筋トレ</span>
                </button>
                <button type="button" class="menu-btn running" onclick="selectMenu('ランニング', '#f1c40f', '🟡')">
                    <span class="icon">🏃</span>
                    <span class="label">ランニング</span>
                </button>
                <button type="button" class="menu-btn rest" onclick="selectMenu('レストトレーニング', '#3498db', '🔵')">
                    <span class="icon">🧘</span>
                    <span class="label">レストトレ</span>
                </button>
                <button type="button" class="menu-btn jumprope" onclick="selectMenu('縄跳び', '#2ecc71', '🟢')">
                    <span class="icon">🪢</span>
                    <span class="label">縄跳び</span>
                </button>
                <button type="button" class="menu-btn prisoner" onclick="selectMenu('プリズナートレーニング', '#9b59b6', '🟣')">
                    <span class="icon">🧱</span>
                    <span class="label">プリズナー</span>
                </button>
                <button type="button" class="menu-btn stretch" onclick="selectMenu('ストレッチ', '#e67e22', '🟠')">
                    <span class="icon">🙆‍♂️</span>
                    <span class="label">ストレッチ</span>
                </button>
            </div>

            <div id="selection-detail" class="detail-card hidden">
                <h3 id="detail-header">選択中: <span id="selected-name">未選択</span></h3>
                <div class="input-group">
                    <label for="memo">内容・振り返り:</label>
                    <textarea id="memo" placeholder="（例：プッシュアップ Step 5、LSD 10kmなど）"></textarea>
                </div>
                
                <button type="button" id="submit-btn" class="calendar-btn" onclick="openCalendar()">
                    Googleカレンダーに追加
                </button>
            </div>

            <!-- エラーデバッグ用表示領域 -->
            <div id="status-msg" style="margin-top: 15px; color: #d9534f; font-weight: bold; text-align: center;"></div>
        </main>

        <footer>
            <p>© 2026 おしえてかめさん - 継続は力なり</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
